<h1>PartsLoc</h1>
<p>PartsLoc is an Android app for keeping track of parts and where they are: scan a code, see
whether you have the part, how many, and which shelf or bin it is in. It works offline, needs
no account, has no ads and does not track you. Your inventory stays on your phone.</p>
